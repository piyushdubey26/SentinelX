name: SentinelX CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Run Build
        run: cd backend && npm run build

      - name: Initialize Databases & Seeds
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: sentinelx
          DB_PASSWORD: sentinelx_password
        run: cd backend && node scripts/setup-db.js

      - name: Run Unit & Integration Tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: sentinelx
          DB_PASSWORD: sentinelx_password
          DB_NAME: sentinelx
          DB_TEST_NAME: sentinelx_test
          JWT_SECRET: ci-test-jwt-secret-key-32-characters-minimum
        run: |
          cd backend
          set -o pipefail
          npx jest --config test/jest-all.json --runInBand --verbose --forceExit 2>&1 | tee test-output.log

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f backend/test-output.log ]; then
            echo "### Jest Test Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat backend/test-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  frontend-checks:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Run Build
        run: cd frontend && npm run build
